<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Icône kinPass MASQUABLE (maskable) : fond plein Midnight Dark + billet centré
       dans la zone sûre (~80 %) pour que la découpe OS ne coupe aucun élément clé.
       Même langage que le Logo.tsx : encoches, dégradé bleu → cyan, reflet, coche. -->
  <rect x="0" y="0" width="512" height="512" fill="#0F172A"/>
  <defs>
    <linearGradient id="kp-grad-m" x1="152" y1="170" x2="360" y2="342" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="kp-shine-m" x1="136" y1="170" x2="376" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <mask id="kp-mask-m">
      <rect x="0" y="0" width="512" height="512" fill="#FFFFFF"/>
      <circle cx="149" cy="256" r="42" fill="#000000"/>
      <circle cx="363" cy="256" r="42" fill="#000000"/>
    </mask>
  </defs>

  <g mask="url(#kp-mask-m)">
    <rect x="126" y="170" width="260" height="172" rx="36" fill="url(#kp-grad-m)"/>
    <rect x="126" y="170" width="260" height="86" rx="36" fill="url(#kp-shine-m)"/>
  </g>

  <!-- Ligne de perforation du talon -->
  <line x1="230" y1="188" x2="230" y2="324" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="13" stroke-linecap="round" stroke-dasharray="18 28"/>

  <!-- Coche de validation -->
  <path d="M298 238 l24 24 58-58" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
