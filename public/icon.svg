<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Icône kinPass — réplique fidèle du Logo.tsx (échelle x10, viewBox 48 → 512) :
       billet aux encoches latérales (perforation), dégradé Electric Blue → Flash Cyan,
       reflet supérieur, ligne de talon pointillée et coche blanche de validation. -->
  <defs>
    <linearGradient id="kp-grad" x1="80" y1="100" x2="400" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="kp-shine" x1="60" y1="100" x2="420" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <mask id="kp-mask">
      <rect x="0" y="0" width="512" height="512" fill="#FFFFFF"/>
      <circle cx="90" cy="256" r="52" fill="#000000"/>
      <circle cx="422" cy="256" r="52" fill="#000000"/>
    </mask>
  </defs>

  <!-- Corps du billet (avec encoches via masque) -->
  <g mask="url(#kp-mask)">
    <rect x="60" y="100" width="392" height="312" rx="44" fill="url(#kp-grad)"/>
    <rect x="60" y="100" width="392" height="156" rx="44" fill="url(#kp-shine)"/>
  </g>

  <!-- Ligne de perforation du talon détachable -->
  <line x1="200" y1="132" x2="200" y2="380" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="15" stroke-linecap="round" stroke-dasharray="22 34"/>

  <!-- Coche de validation (accès autorisé) -->
  <path d="M302 252 l36 36 90-90" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
