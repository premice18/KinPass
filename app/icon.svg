<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Favicon kinPass — même réplique que Logo.tsx (pour l'onglet navigateur). -->
  <defs>
    <linearGradient id="kp-fav" x1="8" y1="10" x2="40" y2="38" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="kp-fav-shine" x1="6" y1="10" x2="42" y2="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="kp-fav-mask">
      <rect x="0" y="0" width="48" height="48" fill="white"/>
      <circle cx="9" cy="24" r="5" fill="black"/>
      <circle cx="39" cy="24" r="5" fill="black"/>
    </mask>
  </defs>
  <g mask="url(#kp-fav-mask)">
    <rect x="6" y="10" width="36" height="28" rx="4" fill="url(#kp-fav)"/>
    <rect x="6" y="10" width="36" height="15" rx="4" fill="url(#kp-fav-shine)"/>
  </g>
  <line x1="19" y1="13" x2="19" y2="35" stroke="white" stroke-opacity="0.55" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 3"/>
  <path d="M27 24l3 3 6.5-6.5" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
